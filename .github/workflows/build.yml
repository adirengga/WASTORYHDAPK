name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek dari zip
        run: unzip -q WAStoryHD.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAStoryHD-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk

      - name: Buat Release berisi APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk WAStoryHD.apk
          gh release create "build-${{ github.run_number }}" WAStoryHD.apk --title "WA Story HD build ${{ github.run_number }}" --notes "APK debug otomatis."
